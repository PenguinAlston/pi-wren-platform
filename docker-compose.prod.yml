# 生产部署编排：docker compose -f docker-compose.prod.yml up -d --build
#
# 前置：
#   1. 仓库根准备 .env（参考 .env.example；生产务必 AUTH_ENABLED=true 等安全配置）
#   2. semantic/wren 已执行 wren context build && wren memory index（只读挂载进容器）
#   3. 首库初始化由 infra/postgres 自动执行；存量库由后端启动时自愈补表
#
# 说明：
#   - 外部已有 PostgreSQL 时可去掉 postgres 服务并把 DB_HOST 指向外部实例
#   - 后端直连库（AI 查询/传统查询）与业务库为同一实例；NODE_ENV=production 时登录 Cookie 加 Secure，
#     需要 TLS（浏览器仅经 https 访问时设置；纯内网 http 部署保持默认 development 即可）

name: pi-wren-prod

services:
  postgres:
    # 官方 postgres:18.4-alpine + Apache AGE 1.7.0 编译层（图谱能力）；
    # shared_preload_libraries 使所有会话预载 age，业务表数据卷不变
    build:
      context: .
      dockerfile: infra/age-postgres.Dockerfile
    image: pi-wren-postgres-age:18.4
    command: ["postgres", "-c", "shared_preload_libraries=age"]
    environment:
      POSTGRES_USER: ${DB_USER:-demo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-demo}
      POSTGRES_DB: ${DB_NAME:-piwren}
    volumes:
      # postgres 18+ 要求挂载在 /var/lib/postgresql（PGDATA 自动落到 18/docker 子目录）
      - pgdata:/var/lib/postgresql
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-demo} -d ${DB_NAME:-piwren}']
      interval: 5s
      timeout: 3s
      retries: 10
      # 首次初始化要跑完 infra/postgres 全部建表+种子脚本，给足宽限
      start_period: 180s
    restart: unless-stopped

  redis:
    image: docker.1ms.run/library/redis:8.4.0
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      args:
        # 国内构建换源：PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple
        #（基础镜像若需走镜像站：PYTHON_IMAGE=docker.1ms.run/library/python:3.13.10-slim）
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
    env_file: .env
    environment:
      # 容器网络内经服务名连库（.env 里的 localhost 不适用于容器）
      DB_HOST: postgres
      WREN_PROJECT_DIR: /semantic/wren
      # Pi 编排层（INTERNAL_API_TOKEN 两边一致，取自 .env）
      PI_ORCHESTRATOR_URL: http://pi-orchestrator:8090
    volumes:
      - ./semantic:/semantic:ro
    ports:
      # 宿主 8080 常被占用（示例部署机上有原生 python 服务），对外映射 18080
      - '18080:8080'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    # 1.6G 小内存主机上限制后端（wren 引擎池建议 AI_ENGINE_POOL_SIZE=1）
    mem_limit: 768m
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: apps/web/Dockerfile
      args:
        # 基础镜像若需走镜像站：NODE_IMAGE=docker.1ms.run/library/node:22-alpine
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8080
    ports:
      - '3000:3000'
    depends_on:
      backend:
        condition: service_started
    mem_limit: 320m
    restart: unless-stopped

  # Pi 编排层（M1）：Agent 循环 + 工具集，仅容器网络内部访问
  pi-orchestrator:
    build: ./services/pi-orchestrator
    environment:
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      PY_BACKEND_URL: http://backend:8080
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      OPENAI_MODEL: ${OPENAI_MODEL}
      # 会话落 Postgres（多副本共享；本地开发默认 jsonl 不受影响）
      PI_SESSION_BACKEND: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-demo}
      DB_PASSWORD: ${DB_PASSWORD:-demo}
      DB_NAME: ${DB_NAME:-piwren}
    volumes:
      - pi_sessions:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m
    restart: unless-stopped

  # 监控采集（可选，1.6G 小内存主机默认不启动）：
  #   docker compose -f docker-compose.prod.yml --profile monitoring up -d prometheus
  # 先在 .env 配 METRICS_TOKEN，并把 infra/prometheus.yml 里的占位令牌换成同值
  prometheus:
    image: ${PROMETHEUS_IMAGE:-docker.m.daocloud.io/prom/prometheus:latest}
    profiles: ["monitoring"]
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - '9090:9090'
    mem_limit: 512m
    restart: unless-stopped

volumes:
  pgdata:
  pi_sessions:
  promdata:
