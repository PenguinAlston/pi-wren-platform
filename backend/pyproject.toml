[project]
name = "piwren-backend"
version = "0.1.0"
description = "pi-wren-platform Python backend (FastAPI + WrenAI + LangGraph)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.30",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sse-starlette>=2.1",
    "loguru>=0.7",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "cryptography>=43",
    # WrenAI 原生 SDK（进程内调用，无子进程）；memory = embedding 语义检索（运行时约 1GB
    # 内存），生产小内存镜像不装，经 WREN_MEMORY_ENABLED=false 关闭（见 wren_engine.py）
    "wrenai[postgres]>=0.13",
    # LangChain + LangGraph agent
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
    # sqlglot：机构行级权限的 SQL AST 强制（semantic/org_scope）
    "sqlglot>=25",
    # tiktoken for token estimation
    "tiktoken>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    # 本地开发保留 embedding 语义检索（生产小内存镜像不装）
    "wrenai[memory]>=0.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
