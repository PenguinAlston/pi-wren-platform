[project]
name = "piwren-backend"
version = "0.1.0"
description = "pi-wren-platform Python backend (FastAPI + WrenAI + LangGraph)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sse-starlette>=2.1",
    "loguru>=0.7",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "cryptography>=43",
    # WrenAI 原生 SDK（进程内调用，无子进程）
    "wrenai[postgres,memory]>=0.13",
    # LangChain + LangGraph agent
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
    # tiktoken for token estimation
    "tiktoken>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
