services:
  postgres:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/postgres:18.4-alpine
    environment:
      # 官方 postgres 镜像环境变量（与应用默认值 demo/piwren 保持一致）
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: piwren
    ports:
      - '5432:5432'
    volumes:
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U demo -d piwren']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: docker.1ms.run/library/redis:8.4.0
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Pi 编排层（M1，可选）：docker compose --profile pi up -d
  # 开发态 FastAPI 跑在宿主机，容器经 host.docker.internal 访问
  pi-orchestrator:
    build: ./services/pi-orchestrator
    profiles: ["pi"]
    environment:
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      PY_BACKEND_URL: http://host.docker.internal:8080
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      OPENAI_MODEL: ${OPENAI_MODEL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - '8090:8090'
