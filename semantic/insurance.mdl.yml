# 保险行业综合查询领域语义配置（MDL 式）
# 依据需求文档第5章生产级表结构：契约(ins_policy_*)/保全(ins_preserve_*)/理赔(ins_claim_*)
name: insurance
catalog: piwren
schema: public

models:
  - name: ins_policy_main
    table: ins_policy_main
    description: 保单主表（契约业务核心）
    columns:
      - { name: policy_id, type: varchar, label: 保单ID（关联键） }
      - { name: policy_no, type: varchar, label: 保单号 }
      - { name: product_id, type: varchar, label: 产品ID }
      - { name: product_type, type: varchar, label: 险种类型（字典编码 01重疾/02医疗/03意外/04寿险/05年金/06财产险） }
      - { name: product_name, type: varchar, label: 险种名称 }
      - { name: policy_status, type: varchar, label: 保单状态（01待核保 02承保有效 03暂保单 04已退保 05已终止 06已失效） }
      - { name: applicant_id, type: varchar, label: 投保人客户ID }
      - { name: insured_id, type: varchar, label: 被保人客户ID }
      - { name: apply_date, type: date, label: 投保日期 }
      - { name: effect_date, type: date, label: 生效日期 }
      - { name: end_date, type: date, label: 终止日期 }
      - { name: year_premium, type: numeric, label: 年交保费 }
      - { name: total_premium, type: numeric, label: 总保费 }
      - { name: total_amount, type: numeric, label: 累计保额 }
      - { name: pay_type, type: varchar, label: 缴费方式 }
      - { name: pay_year, type: integer, label: 缴费年限 }
      - { name: channel_type, type: varchar, label: 投保渠道 }
      - { name: org_code, type: varchar, label: 承保机构 }
      - { name: underwrite_result, type: varchar, label: 核保结果 }
  - name: ins_claim_main
    table: ins_claim_main
    description: 理赔主表（policy_id 关联保单）
    columns:
      - { name: claim_id, type: varchar, label: 理赔号 }
      - { name: policy_id, type: varchar, label: 保单ID（关联 ins_policy_main.policy_id） }
      - { name: claim_type, type: varchar, label: 理赔类型 }
      - { name: claim_status, type: varchar, label: 理赔状态（01待立案 02待查勘 03审核中 04赔付中 05已结案 06拒赔 07撤销报案） }
      - { name: insured_id, type: varchar, label: 被保人客户ID }
      - { name: accident_time, type: timestamp, label: 出险时间 }
      - { name: report_time, type: timestamp, label: 报案时间 }
      - { name: apply_claim_amount, type: numeric, label: 申请赔付金额 }
      - { name: actual_claim_amount, type: numeric, label: 实际赔付金额 }
      - { name: close_time, type: timestamp, label: 结案时间 }
      - { name: claim_reason, type: varchar, label: 出险原因 }
  - name: ins_preserve_main
    table: ins_preserve_main
    description: 保全主表（保单变更，policy_id 关联保单）
    columns:
      - { name: preserve_id, type: varchar, label: 保全单号 }
      - { name: policy_id, type: varchar, label: 保单ID }
      - { name: preserve_type, type: varchar, label: 保全类型（01信息变更 02缴费变更 03受益人变更 04保额调整 05保单复效 06保单挂失 07退保申请） }
      - { name: preserve_status, type: varchar, label: 保全状态（01待审核 02审核通过 03审核驳回 04已办结 05已撤销） }
      - { name: apply_time, type: timestamp, label: 申请时间 }
      - { name: change_desc, type: varchar, label: 变更描述 }
  - name: ins_policy_underwrite
    table: ins_policy_underwrite
    description: 保单核保记录（policy_id 关联保单）
    columns:
      - { name: underwrite_id, type: varchar, label: 核保记录ID }
      - { name: policy_id, type: varchar, label: 保单ID }
      - { name: underwrite_time, type: timestamp, label: 核保时间 }
      - { name: underwrite_type, type: varchar, label: 核保类型 }
      - { name: underwrite_result, type: varchar, label: 核保结果（01通过 02拒保 03延期 04加费承保） }
      - { name: add_fee_rate, type: numeric, label: 加费比例 }
  - name: ins_customer
    table: ins_customer
    description: 客户表
    columns:
      - { name: customer_id, type: varchar, label: 客户ID }
      - { name: customer_name, type: varchar, label: 客户姓名 }
      - { name: gender, type: varchar, label: 性别 }
      - { name: phone, type: varchar, label: 电话 }
  - name: sys_dict
    table: sys_dict
    description: 业务字典表（dict_type + dict_value -> dict_label 中文标签）
    columns:
      - { name: dict_type, type: varchar, label: 字典类型 }
      - { name: dict_value, type: varchar, label: 字典值 }
      - { name: dict_label, type: varchar, label: 字典中文标签 }

intents:
  - name: claim_ratio
    description: 赔付率分析（按险种汇总）
    keywords: [赔付率, 理赔率, 赔付, 出险, 理赔金额, 赔款, 理赔]
    sql: |
      SELECT d.dict_label AS product_type,
             COUNT(c.claim_id) AS claim_count,
             SUM(c.apply_claim_amount) AS apply_amount,
             SUM(c.actual_claim_amount) AS actual_amount
      FROM ins_claim_main c
      JOIN ins_policy_main p ON p.policy_id = c.policy_id
      LEFT JOIN sys_dict d ON d.dict_type = 'product_type' AND d.dict_value = p.product_type
      GROUP BY d.dict_label
      ORDER BY actual_amount DESC;

  - name: premium
    description: 保费规模（按险种）
    keywords: [保费, 收入, 规模, 承保, premium, 保费规模]
    sql: |
      SELECT d.dict_label AS product_type, COUNT(*) AS policy_count, SUM(p.year_premium) AS total_premium
      FROM ins_policy_main p
      LEFT JOIN sys_dict d ON d.dict_type = 'product_type' AND d.dict_value = p.product_type
      GROUP BY d.dict_label
      ORDER BY total_premium DESC;

  - name: policy_status
    description: 保单状态分布
    keywords: [在保, 有效, 保单数量, 保单数, 保单状态, 保单]
    sql: |
      SELECT d.dict_label AS policy_status, COUNT(*) AS policy_count
      FROM ins_policy_main p
      LEFT JOIN sys_dict d ON d.dict_type = 'policy_status' AND d.dict_value = p.policy_status
      GROUP BY d.dict_label
      ORDER BY policy_count DESC;

  - name: policy_terminated_detail
    description: 已终止保单明细（状态=已终止，可按年份筛选终止日期；返回保单号与被保人姓名）
    keywords: [已终止, 终止保单, 保单终止]
    kind: detail
    params: [year]
    yearFallback: '1=1'
    sql: |
      SELECT p.policy_no,
             c.customer_name AS insured_name,
             p.product_name,
             p.end_date,
             p.surrender_date
      FROM ins_policy_main p
      LEFT JOIN ins_customer c ON c.customer_id = p.insured_id
      WHERE p.policy_status = '05'
        AND {year}
      ORDER BY p.end_date;

  - name: policy_expiry_detail
    description: 到期/终止保单明细（按终止日期筛选年份；同时标注已终止/到期两种口径，返回保单号与被保人姓名）
    keywords: [到期, 满期, 到期日, 续保, 续期, 终止日期, 终止, 保单到期]
    kind: detail
    params: [year]
    yearFallback: 'p.end_date IS NOT NULL'
    sql: |
      SELECT p.policy_no,
             c.customer_name AS insured_name,
             p.product_name,
             p.end_date,
             d.dict_label AS policy_status,
             CASE WHEN p.policy_status = '05' THEN '已终止' ELSE '到期' END AS term_type
      FROM ins_policy_main p
      LEFT JOIN ins_customer c ON c.customer_id = p.insured_id
      LEFT JOIN sys_dict d ON d.dict_type = 'policy_status' AND d.dict_value = p.policy_status
      WHERE 1=1
        AND {year}
      ORDER BY term_type, p.end_date;

  - name: claim_status
    description: 理赔状态分布
    keywords: [立案, 查勘, 审核, 拒赔, 已结案, 案件数, 理赔进度, 案件, 进度, 理赔状态]
    sql: |
      SELECT d.dict_label AS claim_status, COUNT(*) AS claim_count
      FROM ins_claim_main c
      LEFT JOIN sys_dict d ON d.dict_type = 'claim_status' AND d.dict_value = c.claim_status
      GROUP BY d.dict_label
      ORDER BY claim_count DESC;

  - name: preserve
    description: 保全业务统计（按类型与状态）
    keywords: [保全, 变更, 复效, 挂失, 退保申请, 保全单]
    sql: |
      SELECT dt.dict_label AS preserve_type, ds.dict_label AS preserve_status, COUNT(*) AS preserve_count
      FROM ins_preserve_main m
      LEFT JOIN sys_dict dt ON dt.dict_type = 'preserve_type' AND dt.dict_value = m.preserve_type
      LEFT JOIN sys_dict ds ON ds.dict_type = 'preserve_status' AND ds.dict_value = m.preserve_status
      GROUP BY dt.dict_label, ds.dict_label
      ORDER BY preserve_count DESC;

  - name: underwrite
    description: 核保结果统计
    keywords: [核保, 加费, 拒保, 延期, 风控, 承保审核]
    sql: |
      SELECT d.dict_label AS underwrite_result, COUNT(*) AS underwrite_count
      FROM ins_policy_underwrite u
      LEFT JOIN sys_dict d ON d.dict_type = 'underwrite_result' AND d.dict_value = u.underwrite_result
      GROUP BY d.dict_label
      ORDER BY underwrite_count DESC;

  - name: avg_premium
    description: 件均保费（按险种）
    keywords: [件均, 平均保费, 客单价]
    sql: |
      SELECT d.dict_label AS product_type, COUNT(*) AS policy_count, AVG(p.year_premium) AS avg_premium
      FROM ins_policy_main p
      LEFT JOIN sys_dict d ON d.dict_type = 'product_type' AND d.dict_value = p.product_type
      GROUP BY d.dict_label
      ORDER BY avg_premium DESC;

  - name: overview
    description: 默认综合总览（按险种）
    keywords: [保险, 总体, 概览, 综合, 情况]
    sql: |
      SELECT d.dict_label AS product_type,
             COUNT(DISTINCT p.policy_id) AS policy_count,
             SUM(p.year_premium) AS total_premium,
             COUNT(DISTINCT c.claim_id) AS claim_count
      FROM ins_policy_main p
      LEFT JOIN ins_claim_main c ON c.policy_id = p.policy_id
      LEFT JOIN sys_dict d ON d.dict_type = 'product_type' AND d.dict_value = p.product_type
      GROUP BY d.dict_label
      ORDER BY total_premium DESC;

defaultIntent: overview

metrics:
  - name: claim_ratio
    definition: 实际赔付金额 / 已赚保费，超过 70% 属于高风险信号
    unit: '%'
  - name: active_policies
    definition: 保单状态为"承保有效"的在保保单数量
  - name: avg_premium
    definition: 年交保费合计 / 保单件数（件均保费）
  - name: claim_count
    definition: 理赔案件数量
  - name: preserve_count
    definition: 保全业务件数
  - name: underwrite_count
    definition: 核保记录数量

knowledge:
  - 保单状态：01-待核保 02-承保有效 03-暂保单 04-已退保 05-已终止 06-已失效
  - 理赔状态：01-待立案 02-待查勘 03-审核中 04-赔付中 05-已结案 06-拒赔 07-撤销报案
  - 保全类型：01-信息变更 02-缴费变更 03-受益人变更 04-保额调整 05-保单复效 06-保单挂失 07-退保申请
  - 赔付率超过 70% 属于高风险信号，需要关注承保质量
  - 重疾险、寿险属于低频高额理赔，医疗险、意外险属于高频低额理赔
  - 业务字典统一存储在 sys_dict 表，机构信息在 sys_org 表
