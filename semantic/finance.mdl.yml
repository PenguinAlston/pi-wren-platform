# 财务分析领域语义配置（MDL 式）
# 结构对齐 Wren AI 的语义建模思路：模型 + 指标 + 知识 + 意图(SQL 生成规则)
name: finance
catalog: piwren
schema: public

models:
  - name: finance_fact
    table: finance_fact
    description: 季度财务事实表
    columns:
      - { name: quarter, type: varchar, label: 季度 }
      - { name: revenue, type: numeric, label: 收入 }
      - { name: cost, type: numeric, label: 成本 }
      - { name: profit, type: numeric, label: 利润 }

intents:
  - name: profit
    description: 利润相关分析
    keywords: [利润, 盈利, 亏损, profit]
    sql: SELECT quarter, revenue, cost, profit FROM finance_fact ORDER BY quarter;

  - name: revenue
    description: 收入 / 营收趋势
    keywords: [收入, 营收, revenue]
    sql: SELECT quarter, revenue FROM finance_fact ORDER BY quarter;

  - name: cost
    description: 成本分析
    keywords: [成本, 费用, cost]
    sql: SELECT quarter, cost FROM finance_fact ORDER BY quarter;

  - name: margin
    description: 毛利 / 利润率分析
    keywords: [毛利, 利润率, margin]
    sql: SELECT quarter, profit, revenue FROM finance_fact ORDER BY quarter;

  - name: overview
    description: 默认财务总览（趋势 + 变化）
    keywords: [财务, 整体, 趋势, 变化, 表现]
    sql: SELECT quarter, revenue, cost, profit FROM finance_fact ORDER BY quarter;

defaultIntent: overview

metrics:
  - name: profit
    definition: 收入减去成本与运营费用（净利润率）
    unit: '%'
  - name: revenue
    definition: 已确认业务收入（同比/环比）
    unit: '%'
  - name: cost
    definition: 运营成本（成本率）
    unit: '%'

knowledge:
  - 财务数据按季度存储在 finance_fact 表中
  - 利润 = 收入 - 成本
  - 成本上升或收入下降都会导致利润下滑
  - Q1 利润 40 万，Q2 下滑至 25 万，Q3 回升至 48 万
